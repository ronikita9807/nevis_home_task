services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
      POSTGRES_DB: nevis
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://nevis:nevis@db:5432/nevis
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://nevis:nevis@db:5432/nevis
      WEB_CONCURRENCY: 2
      # Each worker loads the model; cap ONNX threads so workers do not fight over cores.
      EMBEDDING_THREADS: 2
      # API_KEY is intentionally unset locally: the service key is checked only when set.
      # Opt-in LLM summaries: export ANTHROPIC_API_KEY before `docker compose up`. Empty means
      # extractive summaries only, and no document text leaves the service.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
